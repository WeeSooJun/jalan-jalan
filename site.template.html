<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jalan-Jalan · SG trails + makan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root{
    --bg:#F4F6F2; --card:#FFFFFF; --ink:#1A241E; --muted:#5C6A61; --line:#DDE4DC;
    --canopy:#0E6B45; --canopy-soft:#E3EFE7; --canopy-ink:#0A4F34;
    --amber:#B86E14; --amber-soft:#F6ECDB;
    --plum:#7C4FA0; --plum-soft:#EFE7F5;
    --chip:#EAEFE8; --shadow:0 1px 2px rgba(20,35,26,.08),0 4px 14px rgba(20,35,26,.06);
    --disp:Futura,"Century Gothic","Avenir Next","Trebuchet MS",ui-sans-serif,sans-serif;
    --body:Seravek,"Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101613; --card:#18211C; --ink:#E6EDE7; --muted:#93A398; --line:#2A362E;
      --canopy:#3CB47E; --canopy-soft:#162920; --canopy-ink:#8FD8B4;
      --amber:#E0A04A; --amber-soft:#2A2416;
      --plum:#B48BD6; --plum-soft:#271F30;
      --chip:#222D26; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101613; --card:#18211C; --ink:#E6EDE7; --muted:#93A398; --line:#2A362E;
    --canopy:#3CB47E; --canopy-soft:#162920; --canopy-ink:#8FD8B4;
    --amber:#E0A04A; --amber-soft:#2A2416;
    --plum:#B48BD6; --plum-soft:#271F30;
    --chip:#222D26; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
  :root[data-theme="light"]{
    --bg:#F4F6F2; --card:#FFFFFF; --ink:#1A241E; --muted:#5C6A61; --line:#DDE4DC;
    --canopy:#0E6B45; --canopy-soft:#E3EFE7; --canopy-ink:#0A4F34;
    --amber:#B86E14; --amber-soft:#F6ECDB;
    --plum:#7C4FA0; --plum-soft:#EFE7F5;
    --chip:#EAEFE8; --shadow:0 1px 2px rgba(20,35,26,.08),0 4px 14px rgba(20,35,26,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--canopy)}
  button{font:inherit;cursor:pointer}

  .wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}

  header.app{padding:28px 0 14px}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(1.7rem,5vw,2.3rem);letter-spacing:.02em;margin:0;color:var(--canopy)}
  .tag{color:var(--muted);font-size:.95rem;margin:2px 0 0}
  .progress{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-top:6px}
  .progress b{color:var(--canopy)}

  .search{width:100%;margin:14px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
  .search:focus{outline:2px solid var(--canopy);outline-offset:1px}

  nav.tabs{position:sticky;top:0;z-index:5;display:flex;gap:3px;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:9px 2px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-family:var(--disp);font-weight:600;font-size:.84rem;letter-spacing:.02em}
  .tab[aria-selected="true"]{background:var(--canopy);color:#fff}
  @media (prefers-color-scheme: dark){ .tab[aria-selected="true"]{color:#0E1512} }
  :root[data-theme="dark"] .tab[aria-selected="true"]{color:#0E1512}
  :root[data-theme="light"] .tab[aria-selected="true"]{color:#fff}
  .tab:focus-visible{outline:2px solid var(--canopy);outline-offset:2px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.85rem}
  .chip[aria-pressed="true"]{background:var(--canopy);border-color:var(--canopy);color:#fff}
  @media (prefers-color-scheme: dark){ .chip[aria-pressed="true"]{color:#0E1512} }
  :root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0E1512}
  :root[data-theme="light"] .chip[aria-pressed="true"]{color:#fff}
  .chip:focus-visible{outline:2px solid var(--canopy);outline-offset:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink)}
  button.card{transition:transform .12s ease}
  button.card:hover{transform:translateY(-2px)}
  button.card:focus-visible{outline:2px solid var(--canopy);outline-offset:2px}
  .photo{width:calc(100% + 32px);margin:-16px -16px 0;aspect-ratio:16/9;object-fit:cover;border-radius:9px 9px 0 0;display:block}
  .photo.hero{width:100%;margin:10px 0 0;border-radius:10px;aspect-ratio:16/8}
  .credit{font-size:.68rem;color:var(--muted);margin:4px 0 0}
  .credit a{color:var(--muted)}
  .km{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700;color:var(--canopy);line-height:1}
  .km small{font-size:.8rem;font-weight:400;color:var(--muted)}
  .card h3{margin:0;font-family:var(--disp);font-size:1.05rem;font-weight:700;letter-spacing:.01em;text-wrap:balance}
  .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
  .pill{border-radius:4px;padding:1px 7px;background:var(--chip);white-space:nowrap}
  .pill.walked{background:var(--canopy-soft);color:var(--canopy-ink);font-weight:600}
  .pill.warn{background:var(--amber-soft);color:var(--amber);font-weight:600}
  .blurb{font-size:.88rem;color:var(--muted);margin:0}

  .mrt{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .stn{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;background:var(--chip);border-radius:999px;padding:2px 9px 2px 4px}
  .dot{width:14px;height:14px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:800;color:#fff;font-family:var(--mono)}

  .back{background:none;border:none;color:var(--canopy);font-weight:600;padding:8px 0;margin-top:10px;display:inline-flex;gap:6px;align-items:center}
  .detail h2{font-family:var(--disp);font-size:clamp(1.4rem,4vw,1.8rem);margin:6px 0 2px;text-wrap:balance}
  .statline{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);margin:8px 0 14px}
  .statline b{color:var(--ink);font-size:1.05rem}
  .section{margin-top:22px}
  .eyebrow{font-family:var(--disp);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
  .eyebrow.food{color:var(--amber)} .eyebrow.sight{color:var(--plum)} .eyebrow.trail{color:var(--canopy)}
  ul.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .stop{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
  .stop.f{border-left:3px solid var(--amber)} .stop.s{border-left:3px solid var(--plum)}
  .stop b{display:block}
  .stop .sub{font-size:.85rem;color:var(--muted)}
  .cost{float:right;font-family:var(--mono);font-size:.78rem;color:var(--muted);background:var(--chip);border-radius:4px;padding:1px 7px;margin-left:8px}
  .cost.free{color:var(--canopy);background:var(--canopy-soft)}
  .maplink{display:inline-block;font-size:.78rem;margin-top:3px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--chip)}
  .maplink:hover{border-color:var(--canopy)}
  .mapactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .maplink.big{font-size:.85rem;font-weight:600;padding:6px 13px;color:var(--canopy);cursor:pointer;font-family:inherit}
  .clean{display:block;font-size:.78rem;color:var(--amber);margin-top:3px}
  .alert{background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:8px;padding:10px 14px;font-size:.88rem;margin:12px 0 0}
  .tips{background:var(--canopy-soft);border-radius:8px;padding:12px 16px;font-size:.9rem;color:var(--canopy-ink)}
  .walkbtn{margin-top:20px;border:1px solid var(--canopy);border-radius:8px;background:transparent;color:var(--canopy);padding:9px 18px;font-weight:600}
  .walkbtn[aria-pressed="true"]{background:var(--canopy);color:#fff}
  @media (prefers-color-scheme: dark){ .walkbtn[aria-pressed="true"]{color:#0E1512} }
  :root[data-theme="dark"] .walkbtn[aria-pressed="true"]{color:#0E1512}
  :root[data-theme="light"] .walkbtn[aria-pressed="true"]{color:#fff}

  .fcard{border-left:3px solid var(--amber)}
  .pcard{border-left:3px solid var(--plum)}
  .near{font-size:.78rem;color:var(--canopy);margin:0}

  .links{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
  .links ul{margin:8px 0 0;padding-left:18px;font-size:.9rem}
  .links li{margin-bottom:4px}
  .asof{font-family:var(--mono);font-size:.75rem;color:var(--muted);background:var(--chip);border-radius:4px;padding:2px 8px;display:inline-block;margin:14px 0 0}
  table.sched{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
  .sched th{text-align:left;font-family:var(--disp);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
  .sched td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .sched td:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8rem;white-space:nowrap}
  .tablewrap{overflow-x:auto}

  .mapbox{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:14px;padding:8px}
  .mapbox svg{display:block;width:100%;height:auto}
  .routeline{fill:none;stroke:var(--canopy);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .routehalo{fill:none;stroke:rgba(255,255,255,.9);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  svg .sat ~ .routeline{stroke:#0A7A4E;opacity:1}
  .mc{stroke:var(--card);stroke-width:2}
  .mc.f{fill:var(--amber)} .mc.s{fill:var(--plum)}
  .mt{fill:#fff;font:700 9px var(--mono);pointer-events:none}
  .mt2{fill:#1A241E;font:700 10px var(--mono);paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:3px}
  .stn-mk{fill:#3A4A40;stroke:#fff;stroke-width:1.5}
  .scale{stroke:#1A241E;stroke-width:2;filter:drop-shadow(0 0 2px rgba(255,255,255,.9))}
  .mk{cursor:pointer}
  .maplegend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);padding:6px 8px 2px}
  .maplegend span{display:inline-flex;align-items:center;gap:5px}
  .lg{width:10px;height:10px;border-radius:999px;display:inline-block}
  .mapnote{font-size:.68rem;color:var(--muted);margin:4px 0 0;padding:0 8px 4px}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:999px;color:#fff;font-family:var(--mono);font-size:.68rem;font-weight:700;margin-right:8px}
  .badge.f{background:var(--amber)} .badge.s{background:var(--plum)}
  .stop.flash{outline:2px solid var(--canopy)}

  select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
  textarea{min-height:70px;resize:vertical}
  .plan-item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
  .plan-item input{margin-top:4px;accent-color:var(--canopy)}
  .plan-item label{flex:1;cursor:pointer}
  .copybtn{margin-top:16px;background:var(--canopy);border:none;border-radius:8px;color:#fff;padding:11px 20px;font-weight:700;font-family:var(--disp);letter-spacing:.03em}
  @media (prefers-color-scheme: dark){ .copybtn{color:#0E1512} }
  :root[data-theme="dark"] .copybtn{color:#0E1512}
  :root[data-theme="light"] .copybtn{color:#fff}
  .copied{margin-left:12px;color:var(--canopy);font-size:.9rem}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .lmap{height:min(62vh,420px);border-radius:8px;z-index:0}
  .lmk{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font:700 10px var(--mono);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45)}
  .lmk.f{background:#B86E14} .lmk.s{background:#7C4FA0}
  .lmk.m{background:#3A4A40;border-radius:5px;font-size:8px}
  .locbtn{width:34px;height:32px;background:#fff;color:#000;border:2px solid rgba(0,0,0,.25);border-radius:4px;font-size:16px;line-height:1;cursor:pointer}
  .leaflet-container{font-family:var(--body)}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>

</div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function mapsLink(name){
  const u = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + " Singapore");
  const p = GEO[name];
  const a = p ? `https://maps.apple.com/?q=${encodeURIComponent(name)}&ll=${p[0]},${p[1]}`
              : "https://maps.apple.com/?q=" + encodeURIComponent(name + " Singapore");
  return `<a class="maplink" href="${u}" target="_blank" rel="noopener">📍 Map + photos</a> <a class="maplink" href="${a}" target="_blank" rel="noopener">🍎 Apple Maps</a>`;
}

function routePoints(t){
  return (ROUTES[t.id] || []).map(p => typeof p === "string" ? GEO[p] : p).filter(Boolean);
}

// Google Maps URL API caps waypoints at ~9, so sample the route evenly.
function gmapsDirUrl(t){
  const pts = routePoints(t);
  if(pts.length < 2) return "";
  const mid = pts.slice(1, -1);
  const step = Math.max(1, Math.ceil(mid.length / 8));
  const wp = mid.filter((_, i) => i % step === 0).slice(0, 8);
  const f = p => p[0].toFixed(5) + "," + p[1].toFixed(5);
  return "https://www.google.com/maps/dir/?api=1&origin=" + f(pts[0]) +
    "&destination=" + f(pts[pts.length - 1]) + "&travelmode=walking" +
    (wp.length ? "&waypoints=" + encodeURIComponent(wp.map(f).join("|")) : "");
}

function trailKML(t){
  const x = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const pm = (name, style, g, desc) =>
    `<Placemark><name>${x(name)}</name><styleUrl>#${style}</styleUrl><description>${x(desc)}</description><Point><coordinates>${g[1]},${g[0]},0</coordinates></Point></Placemark>`;
  const parts = [];
  t.food.forEach(([n,ty,pr,note], i) => { if(GEO[n]) parts.push(pm(`F${i+1} · ${n}`, "makan", GEO[n], `${ty} · ${pr} · ${note}`)); });
  t.sights.forEach(([n,c,note], i) => { if(GEO[n]) parts.push(pm(`S${i+1} · ${n}`, "sight", GEO[n], `${c} · ${note}`)); });
  t.mrt.forEach(([stn]) => { const g = GEO[stn + " MRT"]; if(g) parts.push(pm(stn + " MRT", "mrt", g, "Station")); });
  const pts = routePoints(t);
  if(pts.length > 1) parts.push(`<Placemark><name>${x(t.name)} route</name><styleUrl>#route</styleUrl><LineString><tessellate>1</tessellate><coordinates>${pts.map(p => p[1] + "," + p[0] + ",0").join(" ")}</coordinates></LineString></Placemark>`);
  const style = (id, color) => `<Style id="${id}"><IconStyle><color>${color}</color></IconStyle></Style>`;
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Jalan-Jalan · ${x(t.name)}</name>
${style("makan","ff146eb8")}${style("sight","ffa04f7c")}${style("mrt","ff404a3a")}<Style id="route"><LineStyle><color>ff456b0e</color><width>4</width></LineStyle></Style>
${parts.join("\n")}
</Document></kml>`;
}

function savePins(t){
  const blob = new Blob([trailKML(t)], { type: "application/vnd.google-earth.kml+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "jalan-jalan-" + t.id + ".kml";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  const note = $("#pinsnote");
  if(note) note.textContent = "KML saved ✓ Import at mymaps.google.com → Create a new map → Import. Pins + route line come in named and coloured; the map then shows in the Google Maps app under Saved ▸ Maps.";
}

function mrtChips(mrt){
  return '<div class="mrt">' + mrt.map(([stn,lines]) =>
    '<span class="stn">' + lines.map(l =>
      `<span class="dot" style="background:${LINE[l][0]}" title="${l} line">${LINE[l][1]}</span>`
    ).join("") + esc(stn) + '</span>'
  ).join("") + '</div>';
}

function costPill(c){
  const free = /^free/i.test(c);
  return `<span class="cost${free ? " free" : ""}">${esc(c)}</span>`;
}

function cleanNote(name){
  return CLEAN[name] ? `<span class="clean">🧹 closed for cleaning: ${esc(CLEAN[name])}</span>` : "";
}

function matches(t){
  const q = query.toLowerCase();
  if(!q) return true;
  const hay = [t.name, t.region, t.blurb, t.shade, EFFORT[t.effort],
    ...t.highlights, ...t.food.flat(), ...t.sights.flat()].join(" ").toLowerCase();
  return hay.includes(q);
}

function renderProgress(){

let LMAP = null;

function trailMap(t){
  if(routePoints(t).length < 2) return "";
  return `<div class="mapbox">
    <div id="lmap" class="lmap" role="application" aria-label="Interactive map of ${esc(t.name)}"></div>
    <div class="maplegend"><span><span class="lg" style="background:var(--canopy)"></span>route</span><span><span class="lg" style="background:var(--amber)"></span>makan</span><span><span class="lg" style="background:var(--plum)"></span>worth a stop</span><span><span class="lg" style="background:var(--muted);border-radius:2px"></span>MRT</span></div>
    <div class="mapactions">
      ${gmapsDirUrl(t) ? `<a class="maplink big" href="${gmapsDirUrl(t)}" target="_blank" rel="noopener">🧭 Route in Google Maps</a>` : ""}
      <button class="maplink big" data-pins="${t.id}">📌 KML → My Maps</button>
    </div>
    <p class="mapnote" id="pinsnote"></p>
    <p class="mapnote">Pins sit at real coordinates (OneMap); the route line is simplified, not turn-by-turn. Tap a pin to jump to its card, 📍 for your live position.</p>
  </div>`;
}

function initTrailMap(t){
  const el = document.getElementById("lmap");
  if(!el || typeof L === "undefined") return;
  LMAP = L.map(el);
  LMAP.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  const street = L.tileLayer("https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png", {
    minZoom: 11, maxZoom: 19,
    attribution: '<a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener">OneMap</a> © Singapore Land Authority'
  });
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19, attribution: "Imagery © Esri, Maxar, Earthstar Geographics"
  });
  street.addTo(LMAP);
  L.control.layers({ "Street (OneMap)": street, "Satellite (Esri)": sat }).addTo(LMAP);
  const pts = routePoints(t);
  L.polyline(pts, { color: "#0E6B45", weight: 4, opacity: .95 }).addTo(LMAP);
  const bounds = L.latLngBounds(pts);
  const addMk = (name, cls, label, goto) => {
    const g = GEO[name]; if(!g) return;
    bounds.extend(g);
    const m = L.marker(g, {
      icon: L.divIcon({ className: "", html: `<div class="lmk ${cls}">${label}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }),
      title: name
    }).addTo(LMAP);
    m.bindPopup(`<b>${esc(name)}</b>`);
    if(goto) m.on("click", () => {
      const card = document.getElementById(goto);
      if(card){
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.classList.add("flash");
        setTimeout(() => card.classList.remove("flash"), 1600);
      }
    });
  };
  t.food.forEach(([n], i) => addMk(n, "f", "F" + (i + 1), "stop-f-" + i));
  t.sights.forEach(([n], i) => addMk(n, "s", "S" + (i + 1), "stop-s-" + i));
  t.mrt.forEach(([stn]) => addMk(stn + " MRT", "m", "M"));
  LMAP.fitBounds(bounds.pad(0.12));
  L.control.scale({ imperial: false }).addTo(LMAP);
  const Locate = L.Control.extend({
    onAdd(){
      const b = L.DomUtil.create("button", "locbtn");
      b.innerHTML = "📍"; b.title = "Show my location";
      L.DomEvent.on(b, "click", e => { L.DomEvent.stop(e); LMAP.locate({ setView: true, maxZoom: 16 }); });
      return b;
    }
  });
  new Locate({ position: "topleft" }).addTo(LMAP);
  let me = null, ring = null;
  LMAP.on("locationfound", ev => {
    if(me) me.remove(); if(ring) ring.remove();
    ring = L.circle(ev.latlng, { radius: ev.accuracy / 2, weight: 1, color: "#1a73e8", fillOpacity: .08 }).addTo(LMAP);
    me = L.circleMarker(ev.latlng, { radius: 7, weight: 2, color: "#fff", fillColor: "#1a73e8", fillOpacity: 1 }).addTo(LMAP);
  });
  LMAP.on("locationerror", () => {
    const n = $("#pinsnote");
    if(n) n.textContent = "Location unavailable — check the browser's location permission for this site.";
  });
}

function planText(){
  const t = TRAILS.find(x => x.id === plan.trail);
  if(!t) return "";
  const picks = Object.keys(plan.checks).filter(k => plan.checks[k]);
  const warns = picks.filter(k => k.startsWith("f:") && CLEAN[k.slice(2)])
    .map(k => `  ! ${k.slice(2)} cleaning: ${CLEAN[k.slice(2)]}`);
  const lines = [
    `JALAN-JALAN PLAN — ${t.name}`,
    `${t.km} km · ${t.hrs} · ${EFFORT[t.effort]} · ${t.shade}`,
    `MRT: ${t.mrt.map(([s,l]) => `${s} (${l.join("/")})`).join(" / ")}`,
    TRAIL_ALERTS[t.id] ? `NOTICE: ${TRAIL_ALERTS[t.id]}` : "",
    ``,
    `Stops:`,
    ...picks.map(k => `  • ${k.slice(2)}`),
    ...(warns.length ? [``, `Check cleaning dates (NEA, as of ${asof()}):`, ...warns] : []),
    plan.note ? `\nNotes: ${plan.note}` : "",
    ``, `Tip: ${t.tips}`
  ];
  return lines.filter(x => x !== "").join("\n");
}

// ---- render + events ----
function render(){
  if(LMAP){ LMAP.remove(); LMAP = null; }
  renderProgress();
  const v = {trails:viewTrails, makan:viewMakan, see:viewSee, updates:viewUpdates, day:viewDay}[view];
  $("#main").innerHTML = v();
  if(view === "trails" && detail){
    const t = TRAILS.find(x => x.id === detail);
    if(t && trailMap(t)) initTrailMap(t);
  }
}

document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  view = b.dataset.view; detail = null;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === b));
  render();
});

$("#search").addEventListener("input", e => { query = e.target.value; if(detail) detail = null; render(); });

$("#main").addEventListener("click", e => {
  if(e.target.closest("a")) return;
  const gm = e.target.closest("[data-goto]");
  if(gm){
    const el = document.getElementById("stop-" + gm.dataset.goto);
    if(el){
      el.scrollIntoView({behavior:"smooth", block:"center"});
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 1600);
    }
    return;
  }
  const pb = e.target.closest("[data-pins]");
  if(pb){ const t = TRAILS.find(x => x.id === pb.dataset.pins); if(t) savePins(t); return; }
  const card = e.target.closest("[data-trail]");
  if(card){ detail = card.dataset.trail; render(); window.scrollTo({top:0}); return; }
  if(e.target.closest("[data-back]")){ detail = null; render(); return; }
  const rg = e.target.closest("[data-region]");
  if(rg){ region = rg.dataset.region; render(); return; }
  const mf = e.target.closest("[data-mf]");
  if(mf){ makanFilter = mf.dataset.mf; render(); return; }
  const wk = e.target.closest("[data-walk]");
  if(wk){
    const id = wk.dataset.walk;
    walked = walked.includes(id) ? walked.filter(x => x !== id) : walked.concat(id);
    store.set("jj-walked", walked); render(); return;
  }
  if(e.target.closest("[data-copy]")){
    const txt = planText();
    const done = () => { const el = $("#copied"); if(el){ el.textContent = "Copied — paste anywhere"; setTimeout(() => { el.textContent = ""; }, 2500); } };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
    } else fallbackCopy(txt, done);
  }
});

function fallbackCopy(txt, done){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(ta);
}

$("#main").addEventListener("change", e => {
  if(e.target.matches("[data-plantrail]")){
    plan = { trail:e.target.value, checks:{}, note:plan.note };
    store.set("jj-plan", plan); render(); return;
  }
  const ck = e.target.closest("[data-check]");
  if(ck){ plan.checks[ck.dataset.check] = ck.checked; store.set("jj-plan", plan); }
});
$("#main").addEventListener("input", e => {
  if(e.target.matches("[data-note]")){ plan.note = e.target.value; store.set("jj-plan", plan); }
});

render();

// ---- live NEA cleaning dates (client-side; baked CLEAN above is the fallback) ----
let CLEAN_LIVE = false;
async function refreshClean(){
  const MATCH = [
    ["adam road","Adam Road Food Centre"],["85 fengshan","Bedok 85 Fengshan"],
    ["boon lay place","Boon Lay Place Food Village"],["changi village","Changi Village Hawker Centre"],
    ["east coast lagoon","East Coast Lagoon Food Village"],["abc brickworks","ABC Brickworks Market"],
    ["old airport road","Old Airport Road Food Centre"],["pasir panjang food","Pasir Panjang Food Centre"],
    ["pasir ris central","Pasir Ris Central Hawker Centre"],["taman jurong","Taman Jurong Market & Food Centre"],
    ["tampines street 11","Tampines Round Market"],["tampines round","Tampines Round Market"],
    ["chong pang","Chong Pang Market & Food Centre"]
  ];
  const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const today = new Date(); today.setHours(0,0,0,0);
  const parse = s => { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((s || "").trim()); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
  const yr = d => d.getFullYear() === today.getFullYear() ? "" : " " + d.getFullYear();
  const fmt = d => d.getDate() + " " + MO[d.getMonth()] + yr(d);
  const range = (s, e) => {
    if(s.getTime() === e.getTime()) return fmt(e);
    if(s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) return s.getDate() + "–" + fmt(e);
    return s.getDate() + " " + MO[s.getMonth()] + "–" + fmt(e);
  };
  try{
    const r = await fetch("https://data.gov.sg/api/action/datastore_search?resource_id=b80cb643-a732-480d-86b5-e03957bc82aa&limit=200");
    const recs = (await r.json()).result.records;
    const fresh = {};
    for(const rec of recs){
      const nm = (rec.name || "").toLowerCase();
      const hit = MATCH.find(([k]) => nm.includes(k));
      if(!hit) continue;
      const out = [];
      let sawTBC = 0;
      for(let q = 1; q <= 4; q++){
        const rawS = rec["q" + q + "_cleaningstartdate"] || "";
        const s = parse(rawS), e = parse(rec["q" + q + "_cleaningenddate"]);
        if(s && e){ if(e >= today) out.push(range(s, e)); }
        else if(/tbc/i.test(rawS) && !sawTBC && new Date(today.getFullYear(), q * 3, 0) >= today){ sawTBC = q; }
      }
      if(!out.length && sawTBC) out.push("Q" + sawTBC + " TBC");
      const wr = (rec.remarks_other_works || "").trim();
      const ws = parse(rec.other_works_startdate), we = parse(rec.other_works_enddate);
      if(wr && !/^(na|nil|-)$/i.test(wr) && (we ? we >= today : !!ws))
        out.push(wr.toLowerCase().replace(/\.$/, "") + (ws ? " from " + fmt(ws) : ""));
      if(out.length) fresh[hit[1]] = out.join(" · ");
    }
    if(Object.keys(fresh).length){
      Object.keys(CLEAN).forEach(k => delete CLEAN[k]);
      Object.assign(CLEAN, fresh);
      CLEAN_LIVE = true;
      if(view === "makan" || view === "updates") render();
    }
  }catch(e){ /* offline or API down — baked dates stay */ }
}
refreshClean();
</script>
